spring:
  application:
    name: distributed-lite-scheduler-v1

  # 从项目根目录加载 .env（Java Properties 格式），文件不存在时不报错
  config:
    import: optional:file:.env[.properties]

  datasource:
    # 默认值必须加引号，否则 YAML 会把 jdbc: 里的冒号当成键值分隔符导致解析失败
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/distributed_lite_scheduler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jackson:
    default-property-inclusion: NON_NULL
    datatype:
      datetime:
        write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

  web:
    error:
      include-message: ALWAYS
      include-binding-errors: ALWAYS

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.imperium.distributed_lite_scheduler_v1: ${LOG_LEVEL_APP:DEBUG}

# JWT（HS256 密钥至少 32 字节；生产务必通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:01234567890123456789012345678901}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

internal:
  api:
    token: ${INTERNAL_API_TOKEN:}

# 任务执行器：mode=in-process（本机）| remote（远程 Worker）
task:
  executor:
    enabled: ${TASK_EXECUTOR_ENABLED:true}
    mode: ${TASK_EXECUTOR_MODE:in-process}
    scheduler-public-base-url: ${SCHEDULER_PUBLIC_BASE_URL:http://localhost:8080}
    worker-dispatch-path: /api/worker/runs
    worker-connect-timeout-ms: ${WORKER_CONNECT_TIMEOUT_MS:5000}
    worker-read-timeout-ms: ${WORKER_READ_TIMEOUT_MS:15000}
    worker-api-token: ${WORKER_API_TOKEN:}
    core-pool-size: ${TASK_EXECUTOR_CORE_POOL_SIZE:4}
    max-pool-size: ${TASK_EXECUTOR_MAX_POOL_SIZE:16}
    queue-capacity: ${TASK_EXECUTOR_QUEUE_CAPACITY:200}
    work-dir: ${TASK_EXECUTOR_WORK_DIR:}
    output-max-chars: ${TASK_EXECUTOR_OUTPUT_MAX_CHARS:8192}
    timeout-watch-enabled: ${TASK_TIMEOUT_WATCH_ENABLED:true}
    timeout-scan-interval-ms: ${TASK_TIMEOUT_SCAN_INTERVAL_MS:30000}
    timeout-scan-batch-size: ${TASK_TIMEOUT_SCAN_BATCH_SIZE:100}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.imperium.distributed_lite_scheduler_v1: DEBUG
